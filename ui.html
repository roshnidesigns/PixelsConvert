<head>
    <style>
        .bttn-default {
            color: #fff;
        }
        
        .bttn-primary,
        .bttn,
        .bttn-sm {
            color: #1d89ff;
        }
        
        .bttn,
        .bttn-simple {
            margin: 0;
            padding: 0;
            border-width: 0;
            border-color: transparent;
            background: transparent;
            font-weight: 400;
            cursor: pointer;
            position: relative;
            font-size: 20px;
            font-family: inherit;
            padding: 5px 12px;
            overflow: hidden;
            border-width: 0;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.4);
            color: #fff;
            -webkit-transition: all 0.3s cubic-bezier(0.02, 0.01, 0.47, 1);
            transition: all 0.3s cubic-bezier(0.02, 0.01, 0.47, 1);
        }
        
        .bttn-simple:hover,
        .bttn-simple:focus {
            opacity: 0.75;
            outline: none;
        }
        
        .bttn-simple.bttn-sm {
            padding: 4px 20px;
            font-size: 16px;
            font-family: inherit;
        }
        
        .bttn-simple.bttn-primary {
            background: #1d89ff;
        }
        
        .param {
            color: #a5a5a5;
            text-align: right;
        }
        
        body,
        select {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }
        
        p {
            font-size: 14px;
            color: #a5a5a5;
        }
        
        div,
        label {
            margin: auto;
            align-items: center;
            text-align: center;
            font-size: 16px;
        }
        
        span {
            color: #6f42c1;
            text-align: center;
        }
        
        table {
            table-layout: fixed;
            width: 100%;
            margin: auto;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        th,
        td {
            font-size: 14px;
            padding: 5px 10px;
            word-wrap: break-word;
            text-align: right;
            border-bottom: 1px solid #f5f5f5;
        }
    </style>
</head>

<body>
    <div>
        <label for="dpi"><strong>Select screen density</strong></label><br>
        <select name="dpi" id="dpi">
      <option value="ldpi">ldpi ~120dpi (low) </option>
      <option value="mdpi" selected>mdpi ~160dpi (medium): baseline</option>
      <option value="hdpi">hdpi ~240dpi (high) </option>
      <option value="xhdpi">xhdpi ~320dpi (extra-high) </option>
      <option value="xxhdpi">xxhdpi ~480dpi (extra-extra-high) </option>
      <option value="xxxhdpi">xxxhdpi ~640dpi (extra-extra-extra-high) </option>
        </select>
        <button id="convert" class="bttn-simple bttn-sm bttn-primary">Get!</button>
    </div>
    <br>
    <p id="msgd">Select at least 1 layer to get value</p>
    <table style="text-align:center">
        <tr>
            <th>Parameter</th>
            <th id="px">px</th>
            <th id="dp">dp</th>
            <th id="sp">mm</th>
            <th id="pt">pt</th>
            <th id="inch">inch</th>
        </tr>

        <tr>
            <td class="param">x:</td>
            <td><span id="x-px">–</span></td>
            <td><span id="x-dp">–</span></td>
            <td><span id="x-sp">–</span></td>
            <td><span id="x-pt">–</span></td>
            <td><span id="x-inch">–</span></td>
        </tr>
        <tr>
            <td class="param">y:</td>
            <td><span id="y-px">–</span></td>
            <td><span id="y-dp">–</span></td>
            <td><span id="y-sp">–</span></td>
            <td><span id="y-pt">–</span></td>
            <td><span id="y-inch">–</span></td>
        </tr>
        <tr>
            <td class="param">height:</td>
            <td><span id="height-px">–</span></td>
            <td><span id="height-dp">–</span></td>
            <td><span id="height-sp">–</span></td>
            <td><span id="height-pt">–</span></td>
            <td><span id="height-inch">–</span></td>
        </tr>
        <tr>
            <td class="param">width:</td>
            <td><span id="width-px">–</span></td>
            <td><span id="width-dp">–</span></td>
            <td><span id="width-sp">–</span></td>
            <td><span id="width-pt">–</span></td>
            <td><span id="width-inch">–</span></td>
        </tr>
        <tr>
            <td class="param">font-size:</td>
            <td><span id="font-size-px">–</span></td>
            <td><span id="font-size-dp">–</span></td>
            <td><span id="font-size-sp">–</span></td>
            <td><span id="font-size-pt">–</span></td>
            <td><span id="font-size-inch">–</span></td>
        </tr>
        <tr>
            <td class="param">paragraph-spacing:</td>
            <td><span id="para-spacing-px">–</span></td>
            <td><span id="para-spacing-dp">–</span></td>
            <td><span id="para-spacing-sp">–</span></td>
            <td><span id="para-spacing-pt">–</span></td>
            <td><span id="para-spacing-inch">–</span></td>
        </tr>
    </table>


    <script>
        const DPI = {
            ldpi: 120,
            mdpi: 160,
            hdpi: 240,
            xhdpi: 320,
            xxhdpi: 480,
            xxxhdpi: 640
        }
        // element id prefix for each row, and id suffix for each unit column
        const ROWS = {
            x: 'x',
            y: 'y',
            height: 'height',
            width: 'width',
            fontSize: 'font-size',
            paragraphSpacing: 'para-spacing'
        }
        const UNITS = { px: 'px', dp: 'dp', mm: 'sp', pt: 'pt', inch: 'inch' }

        const sendDpi = () => {
            const select = document.getElementById('dpi').value
            parent.postMessage({ pluginMessage: { type: 'setdpi', val: DPI[select] } }, '*')
        }
        document.getElementById('convert').onclick = sendDpi
        document.getElementById('dpi').onchange = sendDpi

        const format = n => String(Math.round(n * 100) / 100)

        const setRow = (row, value) => {
            for (const unit in UNITS) {
                const cell = document.getElementById(ROWS[row] + '-' + UNITS[unit])
                if (value === null) cell.textContent = '–'
                else if (value === 'mixed') cell.textContent = 'mixed'
                else cell.textContent = format(value[unit])
            }
        }

        window.onmessage = event => {
            const message = event.data.pluginMessage
            const msg = document.getElementById('msgd')
            if (message.type === 'empty') {
                msg.textContent = message.str
                msg.style.color = '#e61a1a'
                for (const row in ROWS) setRow(row, null)
            }
            if (message.type === 'values') {
                msg.textContent = message.str
                msg.style.color = '#a5a5a5'
                for (const row in ROWS) setRow(row, message.values[row])
            }
        }
    </script>
</body>
