<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        /* Figma injects --figma-color-* (light + dark) via themeColors; fallbacks are for previews */
        :root {
            --bg: var(--figma-color-bg, #ffffff);
            --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
            --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
            --bg-brand: var(--figma-color-bg-brand, #0d99ff);
            --bg-brand-tertiary: var(--figma-color-bg-brand-tertiary, #e5f4ff);
            --text: var(--figma-color-text, #1e1e1e);
            --text-secondary: var(--figma-color-text-secondary, #757575);
            --text-tertiary: var(--figma-color-text-tertiary, #b3b3b3);
            --text-brand: var(--figma-color-text-brand, #007be5);
            --text-danger: var(--figma-color-text-danger, #dc3412);
            --text-onbrand: var(--figma-color-text-onbrand, #ffffff);
            --border: var(--figma-color-border, #e6e6e6);
            --border-strong: var(--figma-color-border-strong, #2c2c2c);
            --radius: 5px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 11px;
            line-height: 16px;
        }

        body {
            padding: 12px 16px 12px;
        }

        /* density tabs */
        .section-label {
            margin: 0 0 6px;
            color: var(--text-secondary);
        }

        .tabs {
            display: flex;
            gap: 2px;
            padding: 2px;
            border-radius: 6px;
            background: var(--bg-secondary);
        }

        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            min-width: 0;
            height: 40px;
            padding: 0 4px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            color: var(--text-secondary);
            line-height: 14px;
        }

        .tab:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .tab[aria-checked="true"] {
            border-color: var(--border);
            background: var(--bg);
            color: var(--text);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .tab-name {
            font-weight: 600;
        }

        .tab-dpi {
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
        }

        .tab[aria-checked="true"] .tab-dpi {
            color: var(--text-secondary);
        }

        .custom-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .custom-row[hidden] {
            display: none;
        }

        .custom-row label {
            color: var(--text-secondary);
        }

        input {
            width: 88px;
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            font: inherit;
            outline: none;
        }

        input:hover {
            border-color: var(--text-tertiary);
        }

        input:focus {
            border-color: var(--bg-brand);
            box-shadow: 0 0 0 1px var(--bg-brand);
        }

        input.invalid {
            border-color: var(--text-danger);
            box-shadow: 0 0 0 1px var(--text-danger);
        }

        .custom-error {
            color: var(--text-danger);
        }

        /* selection summary */
        .summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 12px 0 4px;
            min-height: 28px;
        }

        .layer {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .layer-name {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chip {
            flex: none;
            padding: 0 6px;
            border-radius: 4px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            flex: none;
        }

        button:hover {
            background: var(--bg-hover);
        }

        button:focus-visible {
            outline: 2px solid var(--bg-brand);
            outline-offset: -1px;
        }

        button svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        /* table */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-variant-numeric: tabular-nums;
        }

        th {
            height: 28px;
            padding: 0 6px;
            color: var(--text-secondary);
            font-weight: 500;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th:first-child {
            width: 124px;
            text-align: left;
        }

        td {
            height: 28px;
            padding: 0 6px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td.param {
            padding-top: 6px;
            padding-bottom: 6px;
            color: var(--text-secondary);
            text-align: left;
            /* long labels like "Paragraph spacing" wrap instead of truncating */
            white-space: normal;
            line-height: 14px;
        }

        td.value {
            cursor: copy;
            border-radius: 4px;
        }

        td.value:hover {
            background: var(--bg-hover);
        }

        td.value.empty {
            color: var(--text-tertiary);
            cursor: default;
        }

        td.value.empty:hover {
            background: none;
        }

        td.value.copied {
            background: var(--bg-brand-tertiary);
            color: var(--text-brand);
        }

        tr[hidden] {
            display: none;
        }

        .hint {
            margin: 8px 0 0;
            color: var(--text-tertiary);
        }

        /* empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 40px 0;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state svg {
            width: 32px;
            height: 32px;
            fill: var(--text-tertiary);
        }

        .empty-state[hidden],
        #results[hidden],
        footer[hidden] {
            display: none;
        }

        /* footer */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--text-brand);
            text-decoration: none;
            cursor: pointer;
        }

        footer a:hover {
            text-decoration: underline;
        }

        footer .love {
            color: var(--text-secondary);
        }

        footer .love:hover {
            color: var(--text);
        }

        /* ---------- What's new tour ---------- */
        #whats-new {
            display: flex;
            flex-direction: column;
            height: 392px;
        }

        #whats-new[hidden],
        #app[hidden] {
            display: none;
        }

        .wn-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 24px;
        }

        .wn-badge {
            padding: 0 8px;
            border-radius: 999px;
            background: var(--bg-brand-tertiary);
            color: var(--text-brand);
            font-weight: 600;
        }

        .wn-skip {
            border: 0;
            background: none;
            color: var(--text-secondary);
        }

        .wn-skip:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .wn-stage {
            position: relative;
            flex: 1;
            overflow: hidden;
            margin-top: 12px;
        }

        .wn-slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
        }

        .wn-slide.in-next { animation: wn-in-next 260ms cubic-bezier(.2, .7, .2, 1) both; }
        .wn-slide.in-prev { animation: wn-in-prev 260ms cubic-bezier(.2, .7, .2, 1) both; }
        .wn-slide.out-next { animation: wn-out-next 200ms ease-in both; }
        .wn-slide.out-prev { animation: wn-out-prev 200ms ease-in both; }

        @keyframes wn-in-next { from { opacity: 0; transform: translateX(32px); } }
        @keyframes wn-in-prev { from { opacity: 0; transform: translateX(-32px); } }
        @keyframes wn-out-next { to { opacity: 0; transform: translateX(-32px); } }
        @keyframes wn-out-prev { to { opacity: 0; transform: translateX(32px); } }

        .wn-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 196px;
            border-radius: 8px;
            background: var(--bg-secondary);
            overflow: hidden;
        }

        .wn-step {
            margin: 16px 0 4px;
            color: var(--text-tertiary);
        }

        .wn-title {
            margin: 0 0 6px;
            font-size: 15px;
            line-height: 20px;
            font-weight: 600;
        }

        .wn-text {
            margin: 0;
            max-width: 420px;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 18px;
        }

        .wn-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            margin-top: 12px;
        }

        .wn-dots {
            display: flex;
            gap: 6px;
        }

        .wn-dots i {
            width: 6px;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            transition: width 200ms, background 200ms;
        }

        .wn-dots i.on {
            width: 18px;
            background: var(--bg-brand);
        }

        .wn-buttons {
            display: flex;
            gap: 8px;
        }

        .wn-buttons button {
            height: 32px;
            padding: 0 14px;
        }

        .wn-buttons button[hidden] {
            display: none;
        }

        button.primary {
            border-color: transparent;
            background: var(--bg-brand);
            color: var(--text-onbrand);
            font-weight: 600;
        }

        button.primary:hover {
            background: var(--bg-brand);
            opacity: .9;
        }

        /* leaving the tour / entering the app */
        #whats-new.leaving {
            animation: wn-leave 220ms ease-in both;
        }

        #app.entering {
            animation: wn-enter 320ms cubic-bezier(.2, .7, .2, 1) both;
        }

        @keyframes wn-leave { to { opacity: 0; transform: scale(.98); } }
        @keyframes wn-enter { from { opacity: 0; transform: translateY(8px); } }

        @media (prefers-reduced-motion: reduce) {
            .wn-slide, #whats-new.leaving, #app.entering { animation: none !important; }
        }

        /* mini illustrations */
        .mini {
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
        }

        .mini-windows {
            display: flex;
            gap: 16px;
        }

        .mini-window {
            width: 170px;
            padding: 10px;
        }

        .mini-window.dark {
            --bg: #2c2c2c;
            --bg-secondary: #1e1e1e;
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, .7);
            --text-tertiary: rgba(255, 255, 255, .4);
            --border: #444444;
            border-color: #444444;
            background: #2c2c2c;
        }

        .mini-bar {
            height: 6px;
            margin-bottom: 6px;
            border-radius: 3px;
            background: var(--bg-secondary);
        }

        .mini-tabs {
            display: flex;
            gap: 2px;
            padding: 2px;
            border-radius: 5px;
            background: var(--bg-secondary);
            margin-bottom: 8px;
        }

        .mini-tabs span {
            flex: 1;
            padding: 3px 6px;
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-secondary);
            font-weight: 600;
            text-align: center;
            line-height: 12px;
        }

        .mini-tabs span small {
            display: block;
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .mini-tabs span.on {
            border-color: var(--border);
            background: var(--bg);
            color: var(--text);
        }

        .mini-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .mini-row span:first-child {
            color: var(--text-secondary);
        }

        .mini-table {
            width: 300px;
            padding: 10px 12px;
        }

        .mini-table .mini-row span {
            flex: 1;
            text-align: right;
            white-space: nowrap;
        }

        .mini-table .mini-row span:first-child {
            flex: 1.6;
            text-align: left;
        }

        .mini-table .head span {
            color: var(--text-secondary);
        }

        .hl {
            border-radius: 3px;
            background: var(--bg-brand-tertiary);
            color: var(--text-brand) !important;
            font-weight: 600;
        }

        .mini-custom {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }

        .mini-input {
            width: 64px;
            padding: 2px 6px;
            border: 1px solid var(--bg-brand);
            border-radius: 4px;
            box-shadow: 0 0 0 1px var(--bg-brand);
            background: var(--bg);
            color: var(--text);
        }

        .mini-toast {
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 6px;
            background: #2c2c2c;
            color: #fff;
            text-align: center;
        }

        .mini-canvas {
            position: relative;
            width: 260px;
            height: 150px;
        }

        .mini-canvas .shape {
            position: absolute;
            border-radius: 4px;
            background: #fcf300;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15);
        }

        .mini-canvas .sel {
            position: absolute;
            border: 1.5px solid #0d99ff;
        }

        .mini-canvas .badge {
            position: absolute;
            transform: translateX(-50%);
            padding: 0 5px;
            border-radius: 3px;
            background: #0d99ff;
            color: #fff;
            font-size: 10px;
            white-space: nowrap;
        }

        .mini-equation {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .mini-equation span {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
        }

        .mini-equation em {
            color: var(--text-tertiary);
            font-style: normal;
        }

        .mini-caption {
            margin-top: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>

<body>
    <section id="whats-new" hidden aria-labelledby="wn-title">
        <div class="wn-top">
            <span class="wn-badge">What's new</span>
            <button class="wn-skip" id="wn-skip">Skip</button>
        </div>
        <div class="wn-stage" id="wn-stage"></div>
        <div class="wn-nav">
            <div class="wn-dots" id="wn-dots"></div>
            <div class="wn-buttons">
                <button id="wn-back">Back</button>
                <button id="wn-next" class="primary">Next</button>
            </div>
        </div>
    </section>

    <main id="app">
    <p class="section-label" id="density-label">Screen density</p>
    <div class="tabs" id="tabs" role="radiogroup" aria-labelledby="density-label"></div>
    <div class="custom-row" id="custom-row" hidden>
        <label for="custom-dpi">Custom dpi</label>
        <input type="number" id="custom-dpi" min="1" max="2000" step="1" placeholder="e.g. 401">
        <span class="custom-error" id="custom-error" hidden>Enter 1–2000</span>
    </div>

    <div class="empty-state" id="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 4v-4h2v6h-6v-2h4zM9 9h6v6H9V9z"/></svg>
        <div id="empty-msg">Select a layer to see its values</div>
    </div>

    <div id="results" hidden>
        <div class="summary">
            <div class="layer">
                <span class="layer-name" id="layer-name"></span>
                <span class="chip" id="dpi-chip"></span>
            </div>
            <button id="copy-all" title="Copy all values as a table">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h8a2 2 0 0 1 2 2v8h-2V3H5V1zM1 5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5zm2 0v8h7V5H3z"/></svg>
                Copy all
            </button>
        </div>

        <table>
            <thead>
                <tr id="head">
                    <th>Property</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <p class="hint">Click any value to copy it.</p>
    </div>

    <footer id="footer">
        <a id="love-link" class="love">♥ Show some love</a>
        <a id="pro-link">Get Pro / Plus →</a>
    </footer>
    </main>

    <script>
        // footer links; a link stays hidden while its URL is empty (the footer too, if both are)
        const PRO_URL = ''
        const LOVE_URL = ''

        const ROWS = [
            { key: 'x', label: 'X' },
            { key: 'y', label: 'Y' },
            { key: 'width', label: 'Width' },
            { key: 'height', label: 'Height' },
            { key: 'fontSize', label: 'Font size' },
            { key: 'paragraphSpacing', label: 'Paragraph spacing' }
        ]
        const UNITS = ['px', 'dp', 'sp', 'pt', 'mm', 'inch']

        let current = null
        const rowEls = {}

        // build the table from ROWS × UNITS
        const head = document.getElementById('head')
        for (const unit of UNITS) {
            const th = document.createElement('th')
            th.textContent = unit
            head.appendChild(th)
        }
        const tbody = document.getElementById('rows')
        for (const row of ROWS) {
            const tr = document.createElement('tr')
            const label = document.createElement('td')
            label.className = 'param'
            label.textContent = row.label
            tr.appendChild(label)
            for (const unit of UNITS) {
                const td = document.createElement('td')
                td.className = 'value'
                td.id = row.key + '-' + unit
                td.onclick = () => copyCell(row.key, unit, td)
                tr.appendChild(td)
            }
            tbody.appendChild(tr)
            rowEls[row.key] = tr
        }

        const post = pluginMessage => parent.postMessage({ pluginMessage }, '*')
        const notify = text => post({ type: 'notify', text })

        // keep the plugin window sized to its content
        const fit = () => post({ type: 'resize', height: Math.ceil(document.body.getBoundingClientRect().height) })

        // density tabs
        const DENSITIES = [
            { name: 'ldpi', dpi: 120 },
            { name: 'mdpi', dpi: 160 },
            { name: 'hdpi', dpi: 240 },
            { name: 'xhdpi', dpi: 320 },
            { name: 'xxhdpi', dpi: 480 },
            { name: 'xxxhdpi', dpi: 640 },
            { name: 'Custom', dpi: null }
        ]
        const tabsEl = document.getElementById('tabs')
        const customRow = document.getElementById('custom-row')
        const customDpi = document.getElementById('custom-dpi')
        const customError = document.getElementById('custom-error')
        const tabEls = []
        let selected = 1

        const sendDpi = () => {
            const isCustom = DENSITIES[selected].dpi === null
            const raw = isCustom ? customDpi.value : DENSITIES[selected].dpi
            const dpi = Number(raw)
            const valid = raw !== '' && dpi > 0 && dpi <= 2000
            const showError = isCustom && raw !== '' && !valid
            customDpi.classList.toggle('invalid', showError)
            customError.hidden = !showError
            if (valid) post({ type: 'setdpi', val: dpi })
        }

        const selectTab = (index, focus) => {
            selected = index
            tabEls.forEach((tab, i) => {
                tab.setAttribute('aria-checked', String(i === index))
                tab.tabIndex = i === index ? 0 : -1
            })
            if (focus) tabEls[index].focus()
            const isCustom = DENSITIES[index].dpi === null
            customRow.hidden = !isCustom
            if (isCustom && !focus) customDpi.focus()
            sendDpi()
            fit()
        }

        DENSITIES.forEach((density, i) => {
            const tab = document.createElement('button')
            tab.className = 'tab'
            tab.setAttribute('role', 'radio')
            tab.title = density.dpi ? density.name + ' · ' + density.dpi + ' dpi' + (density.dpi === 160 ? ' (baseline)' : '') : 'Enter your own dpi'
            const name = document.createElement('span')
            name.className = 'tab-name'
            name.textContent = density.name
            const dpi = document.createElement('span')
            dpi.className = 'tab-dpi'
            dpi.textContent = density.dpi ? density.dpi : '…'
            tab.append(name, dpi)
            tab.onclick = () => selectTab(i, false)
            // arrow keys move between tabs, like a native radio group
            tab.onkeydown = e => {
                const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]
                if (!step) return
                e.preventDefault()
                selectTab((selected + step + DENSITIES.length) % DENSITIES.length, true)
            }
            tabsEl.appendChild(tab)
            tabEls.push(tab)
        })
        customDpi.oninput = sendDpi

        // values
        const format = n => String(Math.round(n * 100) / 100)

        const cellText = (row, unit) => {
            const value = current && current[row]
            if (value === null || value === undefined) return null
            if (value === 'mixed') return 'mixed'
            return format(value[unit])
        }

        const render = () => {
            const hasValues = current !== null
            document.getElementById('empty').hidden = hasValues
            document.getElementById('results').hidden = !hasValues
            if (hasValues) {
                for (const row of ROWS) {
                    // text-only rows are hidden for non-text selections
                    rowEls[row.key].hidden = current[row.key] === null
                    for (const unit of UNITS) {
                        const td = document.getElementById(row.key + '-' + unit)
                        const text = cellText(row.key, unit)
                        td.textContent = text === null ? '–' : text
                        td.classList.toggle('empty', text === null || text === 'mixed')
                        td.title = text === null || text === 'mixed' ? '' : 'Copy ' + text + unit
                    }
                }
            }
            fit()
        }

        // copying: navigator.clipboard is blocked in plugin iframes, so use execCommand
        const copyText = text => {
            const area = document.createElement('textarea')
            area.value = text
            document.body.appendChild(area)
            area.select()
            document.execCommand('copy')
            area.remove()
        }

        const copyCell = (row, unit, td) => {
            const text = cellText(row, unit)
            if (text === null || text === 'mixed') return
            copyText(text + unit)
            notify('Copied ' + text + unit)
            td.classList.add('copied')
            setTimeout(() => td.classList.remove('copied'), 600)
        }

        document.getElementById('copy-all').onclick = () => {
            if (!current) return
            const lines = [['property'].concat(UNITS).join('\t')]
            for (const row of ROWS) {
                if (current[row.key] === null) continue
                const cells = UNITS.map(unit => cellText(row.key, unit))
                lines.push([row.label].concat(cells).join('\t'))
            }
            copyText(lines.join('\n'))
            notify('Copied all values')
        }

        // links
        const proLink = document.getElementById('pro-link')
        const loveLink = document.getElementById('love-link')
        proLink.hidden = !PRO_URL
        loveLink.hidden = !LOVE_URL
        document.getElementById('footer').hidden = !PRO_URL && !LOVE_URL
        proLink.onclick = () => post({ type: 'open', url: PRO_URL })
        loveLink.onclick = () => post({ type: 'open', url: LOVE_URL })

        window.onmessage = event => {
            const message = event.data.pluginMessage
            if (!message) return
            if (message.type === 'empty') {
                current = null
                document.getElementById('empty-msg').textContent = message.str
            }
            if (message.type === 'values') {
                current = message.values
                document.getElementById('layer-name').textContent = message.str
                document.getElementById('dpi-chip').textContent = message.dpi + ' dpi'
            }
            render()
        }


        // ---------- What's new tour (shown once per version; the plugin sets data-whats-new) ----------
        const SLIDES = [
            {
                title: 'A fresh new look',
                text: 'PixelsConvert now looks and feels like Figma, and follows your light or dark theme.',
                visual: `<div class="mini-windows">
                    <div class="mini mini-window"><div class="mini-tabs"><span>mdpi</span><span class="on">hdpi</span><span>xhdpi</span></div>
                        <div class="mini-bar" style="width:80%"></div><div class="mini-bar"></div><div class="mini-bar" style="width:60%"></div></div>
                    <div class="mini mini-window dark"><div class="mini-tabs"><span>mdpi</span><span class="on">hdpi</span><span>xhdpi</span></div>
                        <div class="mini-bar" style="width:80%"></div><div class="mini-bar"></div><div class="mini-bar" style="width:60%"></div></div>
                </div>`
            },
            {
                title: 'Pick a density in one click',
                text: 'Switch between ldpi and xxxhdpi with tabs, or enter any custom dpi. Values update as you go.',
                visual: `<div class="mini" style="width:360px;padding:12px">
                    <div class="mini-tabs"><span>ldpi<small>120</small></span><span>mdpi<small>160</small></span><span>hdpi<small>240</small></span><span class="on">xhdpi<small>320</small></span><span>Custom<small>…</small></span></div>
                    <div class="mini-custom">Custom dpi <span class="mini-input">401</span></div>
                </div>`
            },
            {
                title: 'Now with sp',
                text: 'Get font sizes in scale-independent pixels, right next to dp.',
                visual: `<div class="mini mini-table">
                    <div class="mini-row head"><span>Property</span><span>px</span><span>dp</span><span class="hl">sp</span><span>pt</span></div>
                    <div class="mini-row"><span>Font size</span><span>72</span><span>24</span><span class="hl">24</span><span>10.8</span></div>
                    <div class="mini-row"><span>Paragraph spacing</span><span>24</span><span>8</span><span class="hl">8</span><span>3.6</span></div>
                </div>`
            },
            {
                title: 'Click to copy',
                text: 'Click any value to copy it with its unit, or use Copy all to grab the whole table for a spreadsheet.',
                visual: `<div style="display:flex;flex-direction:column;align-items:center">
                    <div class="mini mini-table">
                        <div class="mini-row head"><span>Property</span><span>px</span><span>dp</span><span>sp</span></div>
                        <div class="mini-row"><span>Width</span><span>984</span><span>328</span><span>328</span></div>
                        <div class="mini-row"><span>Font size</span><span>72</span><span>24</span><span class="hl">24</span></div>
                    </div>
                    <div class="mini-toast">Copied 24sp</div>
                </div>`
            },
            {
                title: 'Measure several layers',
                text: 'Select more than one layer to get the size and position of the whole group.',
                visual: `<div class="mini-canvas">
                    <div class="shape" style="left:40px;top:20px;width:80px;height:50px"></div>
                    <div class="shape" style="left:140px;top:60px;width:80px;height:50px"></div>
                    <div class="sel" style="left:40px;top:20px;width:180px;height:90px"></div>
                    <div class="badge" style="left:130px;top:118px">2 layers · 180 × 90</div>
                </div>`
            },
            {
                title: 'More accurate',
                text: 'mm and inch now follow the selected density, and text with mixed font sizes is marked “mixed”.',
                visual: `<div style="display:flex;flex-direction:column;align-items:center">
                    <div class="mini-equation"><span>1 inch</span><em>=</em><span>25.4 mm</span><em>=</em><span>72 pt</span><em>=</em><span>160 dp</span></div>
                    <div class="mini-caption">at every screen density</div>
                </div>`
            }
        ]

        const whatsNew = document.getElementById('whats-new')
        const app = document.getElementById('app')
        const wnStage = document.getElementById('wn-stage')
        const wnDots = document.getElementById('wn-dots')
        const wnBack = document.getElementById('wn-back')
        const wnNext = document.getElementById('wn-next')
        let slideIndex = 0
        let slideEl = null

        const buildSlide = i => {
            const el = document.createElement('div')
            el.className = 'wn-slide'
            el.innerHTML = '<div class="wn-visual" aria-hidden="true">' + SLIDES[i].visual + '</div>' +
                '<p class="wn-step">' + (i + 1) + ' of ' + SLIDES.length + '</p>' +
                '<h2 class="wn-title"' + (i === slideIndex ? ' id="wn-title"' : '') + '>' + SLIDES[i].title + '</h2>' +
                '<p class="wn-text">' + SLIDES[i].text + '</p>'
            return el
        }

        const showSlide = (i, dir) => {
            const old = slideEl
            slideIndex = i
            slideEl = buildSlide(i)
            if (old) {
                old.classList.add(dir > 0 ? 'out-next' : 'out-prev')
                slideEl.classList.add(dir > 0 ? 'in-next' : 'in-prev')
                old.addEventListener('animationend', () => old.remove(), { once: true })
                // fallback in case animations are disabled
                setTimeout(() => old.remove(), 300)
            }
            wnStage.appendChild(slideEl)
            wnDots.querySelectorAll('i').forEach((dot, k) => dot.classList.toggle('on', k === i))
            wnBack.hidden = i === 0
            wnNext.textContent = i === SLIDES.length - 1 ? 'Start converting' : 'Next'
        }

        const finishWhatsNew = () => {
            post({ type: 'whats-new-done' })
            whatsNew.classList.add('leaving')
            setTimeout(() => {
                whatsNew.hidden = true
                app.hidden = false
                app.classList.add('entering')
                fit()
            }, 220)
        }

        const startWhatsNew = () => {
            app.hidden = true
            whatsNew.hidden = false
            for (let i = 0; i < SLIDES.length; i++) wnDots.appendChild(document.createElement('i'))
            showSlide(0, 0)
            wnNext.onclick = () => slideIndex < SLIDES.length - 1 ? showSlide(slideIndex + 1, 1) : finishWhatsNew()
            wnBack.onclick = () => { if (slideIndex > 0) showSlide(slideIndex - 1, -1) }
            document.getElementById('wn-skip').onclick = finishWhatsNew
            document.addEventListener('keydown', function onKey (e) {
                if (whatsNew.hidden) return document.removeEventListener('keydown', onKey)
                if (e.key === 'ArrowRight') wnNext.onclick()
                else if (e.key === 'ArrowLeft') wnBack.onclick()
                else if (e.key === 'Escape') finishWhatsNew()
            })
            wnNext.focus()
            fit()
        }

        selectTab(1, false)
        render()
        if (document.documentElement.dataset.whatsNew) startWhatsNew()
    </script>
</body>
</html>
